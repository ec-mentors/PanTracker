<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><title>PanTracker - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-rose-50 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-xl shadow-md w-96 border border-rose-100">
    <h1 class="text-3xl font-extrabold text-rose-600 text-center mb-6">Create Profile</h1>
    <div th:if="${error}" class="mb-4 p-3 bg-red-50 text-red-700 text-xs rounded border border-red-200" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Username</label>
            <input type="text" th:field="*{username}" required class="w-full p-2.5 border border-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
            <input type="email" th:field="*{email}" required class="w-full p-2.5 border border-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>
        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white p-2.5 rounded font-bold transition">Sign Up</button>
    </form>
    <p class="text-center text-xs text-gray-500 mt-6">Already have an profile? <a href="/login" class="text-rose-600 font-semibold hover:underline">Login here</a></p>
</div>
</body>
</html>
