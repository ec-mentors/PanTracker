<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><title>PanTracker - Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
<header class="bg-white border-b border-gray-200 py-4 px-8 grid grid-cols-3 items-center shadow-sm">
    <!-- Column 1 (Left): Back to Dashboard + Brand Logo Home Link -->
    <div class="flex justify-start items-center space-x-4">
        <a th:href="@{'/dashboard/' + ${userId}}" class="text-gray-400 hover:text-rose-600 font-bold">&larr; Back</a>
        <span class="text-gray-200">|</span>
        <a th:href="@{'/dashboard/' + ${userId}}" class="text-rose-600 font-extrabold hover:underline">💄 PanTracker</a>
    </div>

    <!-- Column 2 (Center): Centered Title -->
    <div class="flex justify-center text-center">
        <h1 class="text-lg font-bold text-gray-800">My Collection (Active)</h1>
    </div>

    <!-- Column 3 (Right): Navigation with Dashboard Link -->
    <div class="flex justify-end items-center space-x-6">
        <a th:href="@{'/dashboard/' + ${userId}}" class="text-sm font-semibold hover:text-rose-600">Dashboard</a>
        <a th:href="@{'/users/' + ${userId} + '/collection'}" class="text-sm font-semibold hover:text-rose-600 text-rose-600 font-bold">My Collection</a>
        <a th:href="@{'/users/' + ${userId} + '/projects'}" class="text-sm font-semibold hover:text-rose-600">My Projects</a>
        <a th:href="@{'/users/' + ${userId} + '/empties'}" class="text-sm font-semibold hover:text-rose-600">Empties</a>
        <a href="/login" class="text-sm text-gray-400 hover:text-red-500 font-semibold">Logout</a>
    </div>
</header>

<main class="max-w-6xl mx-auto py-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Products Grid List -->
    <section class="lg:col-span-2 space-y-4">
        <h2 class="text-2xl font-bold mb-4">Inventory Products</h2>
        <div class="space-y-3">
            <!-- Die gesamte Zeile ist ein anklickbarer Link -->
            <a th:each="product : ${products}"
               th:href="@{'/products/' + ${product.id} + '/detail/' + ${userId} + '?returnUrl=/users/' + ${userId} + '/collection'}"
               class="block bg-white p-4 rounded-lg border border-gray-200 hover:border-poppy hover:shadow-sm transition flex justify-between items-center cursor-pointer">

                <div class="flex items-center space-x-4">
                        <span class="text-[9px] font-extrabold text-poppy uppercase bg-petal-light py-1 px-2.5 rounded-full border border-petal/30"
                              th:text="${product.categoryName}">LIPSTICK</span>
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm" th:text="${product.name}">Velvet Lip</h3>
                        <p class="text-[10px] text-gray-400 font-medium" th:text="${product.brand != null ? product.brand : 'No Brand'}">NARS</p>
                    </div>
                </div>

                <div class="flex items-center space-x-6 text-xs font-semibold text-gray-500">
                    <span th:if="${product.rating != null}" class="text-amber-500">⭐ <span th:text="${product.rating}">8</span>/10</span>
                    <span>Uses: <strong th:text="${product.totalUses}" class="text-gray-700">0</strong></span>
                    <span th:text="${product.currentWeightGrams} + 'g'" class="text-gray-700">12g</span>
                </div>
            </a>
            <p th:if="${products.isEmpty()}" class="text-sm text-gray-400 italic">No products in collection yet.</p>
        </div>
    </section>

    <!-- Add New Product Form -->
    <section class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm h-fit">
        <h3 class="text-xl font-bold mb-6">Add New Product</h3>
        <form th:action="@{'/users/' + ${userId} + '/collection/add'}" th:object="${productRequest}" method="POST" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Product Name</label>
                <input type="text" th:field="*{name}" required class="w-full p-2 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Brand</label>
                <input type="text" th:field="*{brand}" class="w-full p-2 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Category</label>
                <select th:field="*{categoryId}" class="w-full p-2 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-poppy focus:outline-none bg-white">
                    <option value="">-- Or type new category below --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Lipstick</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Or Create New Category</label>
                <input type="text" th:field="*{newCategoryName}" placeholder="e.g., Bronzer"
                       class="w-full p-2 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-poppy focus:outline-none bg-white">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Purchase Date (Optional)</label>
                <input type="date" th:field="*{purchaseDate}"
                       class="w-full p-2 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-poppy focus:outline-none bg-white">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Opening Date</label>
                    <input type="date" th:field="*{openingDate}" required class="w-full p-2 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">PAO (Months)</label>
                    <input type="number" th:field="*{periodAfterOpeningMonths}" required min="0" class="w-full p-2 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Starting Weight (g)</label>
                <input type="number" step="0.01" th:field="*{startingWeightGrams}" class="w-full p-2 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white p-2.5 rounded font-bold text-sm transition">Add Product</button>
        </form>
    </section>
</main>
</body>
</html>
